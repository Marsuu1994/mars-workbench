name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    name: Prettier (Google style)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Skip lifecycle scripts: the postinstall `prisma generate` needs DB env
      # vars, and Prettier has no dependency on the generated client.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npm run format:check

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # ESLint needs no generated Prisma client, so lifecycle scripts stay off.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts requires DIRECT_URL even though generate never
      # connects; a placeholder is enough.
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The code imports types from the generated client (gitignored).
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

  knip:
    name: Unused code (knip)
    runs-on: ubuntu-latest
    env:
      # Knip loads prisma.config.ts, which requires DIRECT_URL; a placeholder
      # is enough.
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Imports of the generated client must resolve, or knip reports them.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Find unused files, exports and dependencies
        run: npm run knip

  themes:
    name: Theme variable contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Dependency-free script: every theme must declare the same CSS
      # custom properties (see AGENTS.md → Themes).
      - name: Check theme variables
        run: npm run check:themes

  test:
    name: Unit + integration tests (Vitest)
    runs-on: ubuntu-latest
    # Integration tests need Postgres only, not the Supabase stack: production's
    # major version, up in seconds.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The test setup creates and migrates mars_test on this server.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # prisma.config.ts requires DIRECT_URL; the setup points it at mars_test.
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      # Both timezones; fails below the coverage floors in vitest.config.mts.
      - name: Run tests with coverage
        run: npm run test:coverage

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # .env.local from .env.example, npm install, then the local Supabase
      # stack (Postgres + Auth in Docker), migrations and the dev seed.
      - name: Local stack
        run: npm run setup

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Builds and starts production, reseeds the e2e user, runs every project.
      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
