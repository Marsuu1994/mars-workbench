name: Chromium
description: >-
  Playwright's Chromium and the system libraries it needs, for the component
  and e2e jobs. Runs after the dependencies are installed.

runs:
  using: composite
  steps:
    # The browser is cached by Playwright's version (one version serves both
    # @playwright/test and @vitest/browser-playwright), so a hit downloads
    # nothing and only the system libraries are installed from apt.
    - name: Playwright version
      id: playwright
      shell: bash
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache Chromium
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

    # The system libraries come from apt on every run, and a slow Ubuntu mirror
    # can stall their download past the install's timeout (PR #122's first run
    # stopped on fonts-unifont). apt keeps what it downloads in a folder of the
    # runner's home, which is cached by the runner image and Playwright's
    # version: a hit installs the packages from disk, and only apt's package
    # lists still come from the mirror. A new runner image starts from the last
    # image's packages, so only what changed is downloaded.
    - name: Runner image
      id: image
      shell: bash
      run: |
        echo "os=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
        echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

    - name: Cache apt packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/apt-archives/*.deb
        key: chromium-apt-${{ steps.image.outputs.os }}-${{ steps.image.outputs.version }}-${{ steps.playwright.outputs.version }}
        restore-keys: |
          chromium-apt-${{ steps.image.outputs.os }}-

    # apt runs as root and downloads as its sandbox user by default; root
    # downloads straight into the runner's folder instead, so the cache step
    # can read the packages back when the job ends.
    - name: Point apt at the cached packages
      shell: bash
      run: |
        mkdir -p "$HOME/.cache/apt-archives/partial"
        printf '%s\n' \
          "Dir::Cache::Archives \"$HOME/.cache/apt-archives\";" \
          'APT::Keep-Downloaded-Packages "true";' \
          'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
          'APT::Sandbox::User "root";' \
          | sudo tee /etc/apt/apt.conf.d/99-cached-archives > /dev/null

    # The install usually takes under a minute, but a slow mirror once held a
    # job for over five; the timeout fails it fast instead, so it can be re-run.
    - name: Install Chromium
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: timeout 3m npx playwright install --with-deps chromium

    - name: Install Chromium's system libraries
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: timeout 3m npx playwright install-deps chromium
